<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ filename }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0a0a0a;
            color: #eee;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .header {
            padding: 12px 16px;
            background: #111;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header a {
            color: #4fc3f7;
            text-decoration: none;
            font-size: 15px;
        }
        .title {
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            overflow: visible; /* importante */
        }

        video {
            width: 100%;
            max-height: 75vh;
            display: block;
            background: #000;
        }

        video.ratio-original { object-fit: contain; }
        video.ratio-16-9     { object-fit: cover; aspect-ratio: 16/9; }
        video.ratio-4-3      { object-fit: cover; aspect-ratio: 4/3; }
        video.ratio-21-9     { object-fit: cover; aspect-ratio: 21/9; }
        video.ratio-stretch  { object-fit: fill; }

        /* Botão engrenagem */
        .settings-btn {
            position: absolute;
            bottom: 60px;
            right: 14px;
            background: rgba(0, 0, 0, 0.75);
            border: none;
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            transition: 0.2s;
        }
        .settings-btn:hover {
            background: rgba(0, 0, 0, 0.95);
            transform: scale(1.08);
        }

        /* Menu principal */
        .settings-menu {
            position: absolute;
            bottom: 110px;
            right: 14px;
            background: rgba(28, 28, 28, 0.97);
            border-radius: 10px;
            padding: 6px 0;
            min-width: 230px;
            display: none;
            z-index: 40;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .settings-menu.show {
            display: block;
        }

        .menu-item {
            padding: 12px 18px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            transition: 0.15s;
        }
        .menu-item:hover {
            background: rgba(255,255,255,0.1);
        }
        .menu-item .arrow {
            color: #aaa;
            font-size: 12px;
        }

        /* Submenus - agora abrem PARA CIMA e para a ESQUERDA */
        .submenu {
            display: none;
            position: absolute;
            bottom: 0;
            right: 240px; /* abre para a esquerda do menu principal */
            background: rgba(28, 28, 28, 0.97);
            border-radius: 10px;
            min-width: 150px;
            padding: 6px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 50;
        }
        .submenu.show {
            display: block;
        }

        .submenu-item {
            padding: 11px 18px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.15s;
        }
        .submenu-item:hover {
            background: rgba(255,255,255,0.1);
        }
        .submenu-item.active {
            color: #3ea6ff;
            font-weight: 500;
        }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: none;
        }
        .overlay.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/">← Voltar</a>
        <div class="title">{{ filename }}</div>
        <div style="width: 50px;"></div>
    </div>

    <div class="player-wrapper">
        <video id="player" class="ratio-original" controls autoplay>
            <source src="/video/{{ filename }}" type="video/mp4">
        </video>

        <button class="settings-btn" id="settingsBtn" title="Configurações">⚙️</button>

        <div class="settings-menu" id="settingsMenu">
            <div class="menu-item" id="speedMenuBtn">
                <span>Velocidade de reprodução</span>
                <span class="arrow">▶</span>
            </div>
            <div class="menu-item" id="ratioMenuBtn">
                <span>Proporção da tela</span>
                <span class="arrow">▶</span>
            </div>
        </div>

        <!-- Submenu Velocidade -->
        <div class="submenu" id="speedSubmenu">
            <div class="submenu-item" data-speed="0.5">0.5x</div>
            <div class="submenu-item" data-speed="0.75">0.75x</div>
            <div class="submenu-item active" data-speed="1">Normal</div>
            <div class="submenu-item" data-speed="1.25">1.25x</div>
            <div class="submenu-item" data-speed="1.5">1.5x</div>
            <div class="submenu-item" data-speed="1.75">1.75x</div>
            <div class="submenu-item" data-speed="2">2x</div>
        </div>

        <!-- Submenu Proporção -->
        <div class="submenu" id="ratioSubmenu">
            <div class="submenu-item active" data-ratio="original">Original</div>
            <div class="submenu-item" data-ratio="16-9">16:9</div>
            <div class="submenu-item" data-ratio="4-3">4:3</div>
            <div class="submenu-item" data-ratio="21-9">21:9</div>
            <div class="submenu-item" data-ratio="stretch">Esticar</div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>

    <script>
        const video = document.getElementById('player');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsMenu = document.getElementById('settingsMenu');
        const speedSubmenu = document.getElementById('speedSubmenu');
        const ratioSubmenu = document.getElementById('ratioSubmenu');
        const overlay = document.getElementById('overlay');

        settingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = settingsMenu.classList.contains('show');
            closeAllMenus();
            if (!isOpen) {
                settingsMenu.classList.add('show');
                overlay.classList.add('show');
            }
        });

        document.getElementById('speedMenuBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            ratioSubmenu.classList.remove('show');
            speedSubmenu.classList.toggle('show');
        });

        document.getElementById('ratioMenuBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            speedSubmenu.classList.remove('show');
            ratioSubmenu.classList.toggle('show');
        });

        function closeAllMenus() {
            settingsMenu.classList.remove('show');
            speedSubmenu.classList.remove('show');
            ratioSubmenu.classList.remove('show');
            overlay.classList.remove('show');
        }

        overlay.addEventListener('click', closeAllMenus);

        // Velocidade
        document.querySelectorAll('#speedSubmenu .submenu-item').forEach(item => {
            item.addEventListener('click', () => {
                const speed = parseFloat(item.dataset.speed);
                video.playbackRate = speed;
                document.querySelectorAll('#speedSubmenu .submenu-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                closeAllMenus();
            });
        });

        // Proporção
        document.querySelectorAll('#ratioSubmenu .submenu-item').forEach(item => {
            item.addEventListener('click', () => {
                const ratio = item.dataset.ratio;
                video.classList.remove('ratio-original', 'ratio-16-9', 'ratio-4-3', 'ratio-21-9', 'ratio-stretch');
                video.classList.add(`ratio-${ratio}`);
                document.querySelectorAll('#ratioSubmenu .submenu-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                closeAllMenus();
            });
        });

        // Atalhos
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            switch(e.key) {
                case ' ':
                    e.preventDefault();
                    video.paused ? video.play() : video.pause();
                    break;
                case 'ArrowRight':
                    video.currentTime += 10;
                    break;
                case 'ArrowLeft':
                    video.currentTime -= 10;
                    break;
                case 'f':
                case 'F':
                    document.fullscreenElement ? document.exitFullscreen() : video.requestFullscreen();
                    break;
            }
        });
    </script>
</body>
</html>
